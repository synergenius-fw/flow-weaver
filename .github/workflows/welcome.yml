name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          issue_message: |
            Thanks for opening your first issue! We'll take a look shortly.

            In the meantime, check out the [docs](https://github.com/synergenius-fw/flow-weaver#readme) (or run `fw docs`) — your answer might already be there.
          pr_message: |
            Thanks for your first pull request! We appreciate the contribution.

            A maintainer will review this soon. Make sure CI passes and the PR checklist is complete. Opening a pull request means you agree to the [Contributor License Agreement](https://github.com/synergenius-fw/flow-weaver/blob/main/CLA.md).
