name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A stalled runner must not indefinitely block the shared desktop-release
    # pool. Normal builds complete in well under two minutes.
    timeout-minutes: 10
    # Keep compiler/test workloads on the maintained heavy pool. The
    # `fw-fast` runner is a lightweight interactive lane and has repeatedly
    # stalled dependency setup under matrix load.
    runs-on: [self-hosted, linux, fw-heavy]
    outputs:
      is_release: ${{ steps.detect.outputs.is_release }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Authenticate to private Verdaccio
        run: echo "//npm.example.com/:_auth=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc

      - run: npm ci

      - name: Detect release PR
        id: detect
        run: |
          if [[ "${{ github.head_ref }}" == release/* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run typecheck
      - run: npm run build

  test:
    needs: build
    if: needs.build.outputs.is_release == 'false'
    # Test shards normally finish in a few minutes. Bound a wedged worker so
    # one bad shard cannot monopolise a self-hosted runner indefinitely.
    timeout-minutes: 15
    runs-on: [self-hosted, linux, fw-heavy]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Authenticate to private Verdaccio
        run: echo "//npm.example.com/:_auth=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc

      - run: npm ci

      - name: Run tests (shard ${{ matrix.shard }}/3)
        run: npx vitest run --shard=${{ matrix.shard }}/3 --reporter=default
        # Per-worker heap ceilings live in vitest.config.ts (execArgv, sized to
        # the 8 GB runner). NODE_OPTIONS here only bounds the parent vitest
        # process, which orchestrates and doesn't hold the ts-morph working set.
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'

  coverage:
    # Wait for the test matrix before kicking off so the heavy --coverage
    # run doesn't share runners with the 3 test shards. With 3 self-hosted
    # runners, parallel test+coverage saturates RAM/swap; sequencing keeps
    # each phase under the box's working set.
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 25
    runs-on: [self-hosted, linux, fw-heavy]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Authenticate to private Verdaccio
        run: echo "//npm.example.com/:_auth=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc

      - run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --reporter=default --reporter=json --outputFile=test-results.json --coverage
        # See the test job: per-worker heap is configured in vitest.config.ts.
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Extract test count
        id: test-count
        run: |
          PASSED=$(jq '.numPassedTests' test-results.json)
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"

      - name: Update test count badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: flow-weaver-test-count.json
          label: tests
          message: '${{ steps.test-count.outputs.passed }} passed'
          color: brightgreen

  check:
    if: always()
    needs: [build, test, coverage]
    timeout-minutes: 5
    runs-on: [self-hosted, linux, fw-heavy]
    steps:
      - name: Evaluate results
        run: |
          echo "build: ${{ needs.build.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "coverage: ${{ needs.coverage.result }}"

          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::Build failed"
            exit 1
          fi

          if [[ "${{ needs.test.result }}" != "success" && "${{ needs.test.result }}" != "skipped" ]]; then
            echo "::error::Tests failed"
            exit 1
          fi

          if [[ "${{ needs.coverage.result }}" != "success" && "${{ needs.coverage.result }}" != "skipped" ]]; then
            echo "::error::Coverage failed"
            exit 1
          fi

          echo "All checks passed"
