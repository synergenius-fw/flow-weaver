name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default: nothing here writes to the repository. The Codecov
# upload authenticates with its own token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Normal builds complete in well under five minutes on a hosted runner.
    timeout-minutes: 10
    # GitHub-hosted. The self-hosted pool (fw-heavy / fw-fast) is gone.
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.detect.outputs.is_release }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'


      - run: npm ci

      - name: Detect release PR
        id: detect
        # The branch name is the PR author's text: read it from the
        # environment, never interpolated into the script.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" == release/* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run typecheck:console
      - run: npm run lint
      - run: npm run lint:dead
      - run: npm run build
      # The tests that need the build output; the test job does not build.
      - name: Test the built bundle
        run: npx vitest run tests/cli/built-binary-console.test.ts tests/cli/startup-modules.test.ts
        env:
          FW_REQUIRE_BUILD: '1'

  test:
    needs: build
    if: needs.build.outputs.is_release == 'false'
    # With coverage on, a shard's tests take about six minutes. Bound a wedged
    # worker so one bad shard cannot run indefinitely.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Six, not three: coverage roughly doubles the tests' time, and three
        # shards took 12-14 minutes each against the 20-minute bound.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'


      - run: npm ci

      # Coverage is collected here, in the shards, and merged by the coverage
      # job. A separate job that ran the whole suite again with --coverage
      # outgrew its 30 minutes; this way the suite runs once, and every PR
      # exercises the same coverage path main does.
      - name: Run tests (shard ${{ matrix.shard }}/6)
        run: npx vitest run --shard="$SHARD/6" --coverage --reporter=default --reporter=blob --outputFile.blob=".vitest-reports/blob-$SHARD.json"
        # Per-worker heap ceilings live in vitest.config.ts (execArgv, sized to
        # a 7-8 GB runner). NODE_OPTIONS here only bounds the parent vitest
        # process, which orchestrates and doesn't hold the ts-morph working set.
        env:
          SHARD: ${{ matrix.shard }}
          NODE_OPTIONS: '--max-old-space-size=2048'

      - name: Keep the shard's results for the coverage merge
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          # upload-artifact skips hidden paths by default, and this one starts
          # with a dot.
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  e2e:
    # The console's client in Chromium, against a real console per test
    # (playwright.config.ts, e2e/). The suite itself takes well under a minute.
    needs: build
    if: needs.build.outputs.is_release == 'false'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      # npm ci runs `prepare`, which is `npm run build`: dist/, the console
      # client included, is built here, which is what the tests start.
      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

  coverage:
    # Merges the shards' results into one report; it runs no tests itself.
    needs: [build, test]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge the shards' coverage
        run: >-
          npx vitest run --merge-reports=.vitest-reports --coverage --reporter=dot
          --coverage.reporter=text-summary --coverage.reporter=json-summary
          --coverage.reporter=lcov --coverage.reporter=html

      - name: Write the totals to the job summary
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`;
            console.log(["## Coverage", "", "| | Covered | |", "|---|---|---|",
              row("lines"), row("statements"), row("functions"), row("branches")].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      # Codecov needs a CODECOV_TOKEN secret for this repository; without one
      # every upload is refused, so the step only runs once the secret exists.
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  check:
    if: always()
    needs: [build, test, e2e, coverage]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "build: ${{ needs.build.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "e2e: $E2E_RESULT"
          echo "coverage: ${{ needs.coverage.result }}"

          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::Build failed"
            exit 1
          fi

          if [[ "${{ needs.test.result }}" != "success" && "${{ needs.test.result }}" != "skipped" ]]; then
            echo "::error::Tests failed"
            exit 1
          fi

          if [[ "$E2E_RESULT" != "success" && "$E2E_RESULT" != "skipped" ]]; then
            echo "::error::Console end-to-end tests failed"
            exit 1
          fi

          if [[ "${{ needs.coverage.result }}" != "success" && "${{ needs.coverage.result }}" != "skipped" ]]; then
            echo "::error::Coverage failed"
            exit 1
          fi

          echo "All checks passed"
