name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default: nothing here writes to the repository. The Codecov
# upload authenticates with its own token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Normal builds complete in well under five minutes on a hosted runner.
    timeout-minutes: 10
    # GitHub-hosted. The self-hosted pool (fw-heavy / fw-fast) is gone.
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.detect.outputs.is_release }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'


      - run: npm ci

      - name: Detect release PR
        id: detect
        # The branch name is the PR author's text: read it from the
        # environment, never interpolated into the script.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" == release/* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run typecheck:console
      - run: npm run lint
      - run: npm run lint:dead
      - run: npm run build

  test:
    needs: build
    if: needs.build.outputs.is_release == 'false'
    # Test shards normally finish in a few minutes. Bound a wedged worker so
    # one bad shard cannot run indefinitely.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'


      - run: npm ci

      - name: Run tests (shard ${{ matrix.shard }}/3)
        run: npx vitest run --shard=${{ matrix.shard }}/3 --reporter=default
        # Per-worker heap ceilings live in vitest.config.ts (execArgv, sized to
        # a 7-8 GB runner). NODE_OPTIONS here only bounds the parent vitest
        # process, which orchestrates and doesn't hold the ts-morph working set.
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'

  coverage:
    # Runs after the test matrix so a red shard fails fast before the long
    # --coverage pass starts.
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'


      - run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --reporter=default --coverage
        # See the test job: per-worker heap is configured in vitest.config.ts.
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  check:
    if: always()
    needs: [build, test, coverage]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          echo "build: ${{ needs.build.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "coverage: ${{ needs.coverage.result }}"

          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::Build failed"
            exit 1
          fi

          if [[ "${{ needs.test.result }}" != "success" && "${{ needs.test.result }}" != "skipped" ]]; then
            echo "::error::Tests failed"
            exit 1
          fi

          if [[ "${{ needs.coverage.result }}" != "success" && "${{ needs.coverage.result }}" != "skipped" ]]; then
            echo "::error::Coverage failed"
            exit 1
          fi

          echo "All checks passed"
