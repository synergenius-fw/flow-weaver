name: Release & Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-and-publish:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: [self-hosted, linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          TAG="${BRANCH#release/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        # Idempotent: a re-triggered release (or a prior run that died after
        # tagging but before publish) must not brick on "release already
        # exists". Publish-to-Verdaccio below is the real deliverable; the
        # GitHub release is bookkeeping, so skip it when the tag is taken.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --target main
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Authenticate to private Verdaccio
        # _auth (legacy basic-auth, base64) matches what Verdaccio's htpasswd
        # plugin accepts for the github-ci service account. NPM_TOKEN is
        # base64(`github-ci:<password>`), not a JWT. Mirrors every platform
        # workflow (release-synergenius-console.yml, _ci-tests.reusable.yml)
        # and this repo's own ci.yml, all of which authenticate this way.
        run: |
          {
            echo "//npm.example.com/:_auth=${{ secrets.NPM_TOKEN }}"
            echo "@synergenius:registry=https://npm.example.com/"
            echo "@fw:registry=https://npm.example.com/"
          } > ~/.npmrc

      # npm itself authenticates fine with _auth (metadata + publish succeed),
      # but `npm whoami` returns empty under basic-auth, so the preinstall
      # guard (scripts/check-npm-auth.mjs) misfires and aborts the install.
      # Skip it here exactly as the Console release workflow does.
      - run: npm install
        env:
          SYNERGENIUS_SKIP_AUTH_CHECK: '1'

      - name: Verify README exists
        run: |
          if [ ! -f README.md ]; then echo "ERROR: README.md missing" && exit 1; fi
          echo "README.md exists ($(wc -c < README.md) bytes)"

      - name: Strip preinstall from published package.json
        # Hook is dev-only; scripts/check-npm-auth.mjs lives only in the repo,
        # not in the published tarball, so a consumer's npm install would hit
        # MODULE_NOT_FOUND on the missing script.
        run: npm pkg delete scripts.preinstall

      - name: Pack, verify, and publish to Verdaccio
        run: |
          npm pack --pack-destination /tmp
          TARBALL=$(ls /tmp/synergenius-flow-weaver-*.tgz)
          echo "Tarball: $TARBALL"
          tar -tzf "$TARBALL" | grep README.md || (echo "ERROR: README.md not in tarball" && exit 1)
          npm publish "$TARBALL"
          rm -f "$TARBALL"

      - name: Verify README on Verdaccio registry
        run: |
          sleep 15
          VERSION=$(node -p "require('./package.json').version")
          LEN=$(curl -s -H "Authorization: Basic ${{ secrets.NPM_TOKEN }}" "https://npm.example.com/@synergenius/flow-weaver/$VERSION" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).readme?.length || 0")
          echo "README length on Verdaccio: $LEN bytes"
          if [ "$LEN" -lt 100 ]; then echo "::warning::README may not have been published correctly ($LEN bytes)"; fi
