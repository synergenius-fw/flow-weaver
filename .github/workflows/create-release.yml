name: Release & Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-and-publish:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm provenance: lets npm link each published version to this workflow run.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          TAG="${BRANCH#release/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        # Idempotent: a re-triggered release (or a prior run that died after
        # tagging but before publish) must not brick on "release already
        # exists". Publish-to-npm below is the real deliverable; the
        # GitHub release is bookkeeping, so skip it when the tag is taken.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --target main
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC, no stored token) needs npm 11.5.1 or later;
      # Node 22 ships npm 10.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Verify README exists
        run: |
          if [ ! -f README.md ]; then echo "ERROR: README.md missing" && exit 1; fi
          echo "README.md exists ($(wc -c < README.md) bytes)"

      - name: Pack, verify, and publish to npm
        # Publishes through npm trusted publishing: the package's npm settings
        # name this repository and workflow, and npm exchanges the run's OIDC
        # token (id-token: write above) for a short-lived publish credential.
        # NPMJS_TOKEN is only a fallback and may be unset.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
        run: |
          # Pack into a clean per-run dir and read the EXACT filename npm
          # pack prints (last stdout line). The old `ls /tmp/...-*.tgz` glob
          # broke when a prior run left a stale tarball in /tmp: it matched
          # two files, so $TARBALL became a
          # newline-joined pair and `tar`/`npm publish` got an invalid path.
          PACKDIR=$(mktemp -d)
          TARBALL_NAME=$(npm pack --pack-destination "$PACKDIR" --silent | tail -n1)
          TARBALL="$PACKDIR/$TARBALL_NAME"
          echo "Tarball: $TARBALL"
          tar -tzf "$TARBALL" | grep README.md || (echo "ERROR: README.md not in tarball" && exit 1)
          npm publish "$TARBALL" --access public --provenance
          rm -rf "$PACKDIR"

      - name: Verify README on npm
        run: |
          sleep 15
          VERSION=$(node -p "require('./package.json').version")
          LEN=$(curl -s "https://registry.npmjs.org/@synergenius/flow-weaver/$VERSION" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).readme?.length || 0")
          echo "README length on npm: $LEN bytes"
          if [ "$LEN" -lt 100 ]; then echo "::warning::README may not have been published correctly ($LEN bytes)"; fi
