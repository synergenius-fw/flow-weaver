name: Release & Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-and-publish:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: [self-hosted, linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          TAG="${BRANCH#release/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --target main

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Authenticate to private Verdaccio
        # NPM_TOKEN is a Verdaccio JWT, so it must go in `_authToken` (bearer),
        # not `_auth` (which npm treats as base64 user:password and Verdaccio
        # rejects with E401 on publish). Matches the platform repo's npmrc
        # convention + its `_authToken=…NPM_TOKEN` workflow-auth lint.
        run: echo "//npm.example.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc

      - run: npm install

      - name: Verify README exists
        run: |
          if [ ! -f README.md ]; then echo "ERROR: README.md missing" && exit 1; fi
          echo "README.md exists ($(wc -c < README.md) bytes)"

      - name: Strip preinstall from published package.json
        # Hook is dev-only; scripts/check-npm-auth.mjs lives only in the repo,
        # not in the published tarball, so a consumer's npm install would hit
        # MODULE_NOT_FOUND on the missing script.
        run: npm pkg delete scripts.preinstall

      - name: Pack, verify, and publish to Verdaccio
        run: |
          npm pack --pack-destination /tmp
          TARBALL=$(ls /tmp/synergenius-flow-weaver-*.tgz)
          echo "Tarball: $TARBALL"
          tar -tzf "$TARBALL" | grep README.md || (echo "ERROR: README.md not in tarball" && exit 1)
          npm publish "$TARBALL"
          rm -f "$TARBALL"

      - name: Verify README on Verdaccio registry
        run: |
          sleep 15
          VERSION=$(node -p "require('./package.json').version")
          LEN=$(curl -s -H "Authorization: Bearer ${{ secrets.NPM_TOKEN }}" "https://npm.example.com/@synergenius/flow-weaver/$VERSION" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).readme?.length || 0")
          echo "README length on Verdaccio: $LEN bytes"
          if [ "$LEN" -lt 100 ]; then echo "::warning::README may not have been published correctly ($LEN bytes)"; fi
