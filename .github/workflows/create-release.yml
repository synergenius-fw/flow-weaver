name: Release & Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release-and-publish:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          TAG="${BRANCH#release/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --target main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install

      - name: Verify README exists
        run: |
          if [ ! -f README.md ]; then echo "ERROR: README.md missing" && exit 1; fi
          echo "README.md exists ($(wc -c < README.md) bytes)"

      - name: Pack, verify, and publish to npm
        run: |
          npm pack --pack-destination /tmp
          TARBALL=$(ls /tmp/synergenius-flow-weaver-*.tgz)
          echo "Tarball: $TARBALL"
          tar -tzf "$TARBALL" | grep README.md || (echo "ERROR: README.md not in tarball" && exit 1)
          npm publish "$TARBALL" --provenance --access public
          rm -f "$TARBALL"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify README on npm registry
        run: |
          sleep 15
          VERSION=$(node -p "require('./package.json').version")
          LEN=$(curl -s "https://registry.npmjs.org/@synergenius/flow-weaver/$VERSION" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).readme?.length || 0")
          echo "README length on npm: $LEN bytes"
          if [ "$LEN" -lt 100 ]; then echo "::warning::README may not have been published correctly ($LEN bytes)"; fi
